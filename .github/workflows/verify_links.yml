name: Link Validator & PWA Integrity Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate All Internal Hyperlinks
        run: |
          python3 <<'PY'
          import glob
          import os
          import re
          from urllib.parse import unquote

          excluded = {'.git', 'android', 'node_modules', 'runtime', 'logs', 'web', '__pycache__'}
          files = [f for f in glob.glob('**/*.html', recursive=True) if not excluded.intersection(f.split(os.sep))]
          broken = 0
          for f in files:
              with open(f, encoding='utf-8') as fh:
                  content = fh.read()
              content = re.sub(r'<script.*?>.*?</script>', '', content, flags=re.DOTALL)
              for match in re.finditer(r'href=["\']([^"\'#:]+)["\']', content):
                  target = unquote(match.group(1)).split('?', 1)[0]
                  if target.startswith(('http', 'mailto:', 'tel:', 'javascript:')):
                      continue
                  if not os.path.exists(os.path.normpath(os.path.join(os.path.dirname(f), target))):
                      print(f'BROKEN LINK in {f}: {target}')
                      broken += 1
          if broken:
              raise SystemExit(f'FAILED: {broken} broken links found')
          print(f'SUCCESS: Checked {len(files)} files, 0 broken links!')
          PY

      - name: Check PWA Manifest & Service Worker
        run: |
          test -f manifest.json && echo "manifest.json OK"
          test -f sw.js && echo "sw.js OK"
          test -f assets/icons/icon-192.png && echo "icon-192 OK"
